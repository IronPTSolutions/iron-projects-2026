app = 'api-ancient-paper-8537'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[env]
  COOKIE_SECURE = 'true'
  VALID_INVITE_CODES = 'abc'
  CORS_ORIGIN = 'https://iron-projects.netlify.app'
  API_URL = 'https://api-ancient-paper-8537.fly.dev/api'
